<style>

.hero{background:linear-gradient(115deg,#14b6bd,#168fbd 68%,#286bb2);border-radius:21px;padding:18px 17px;min-height:92px;color:#fff;position:relative;overflow:hidden;box-shadow:0 10px 25px #148c9b2b;margin-bottom:14px;display:flex;flex-direction:column;justify-content:center}

.filters{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding:0 0 13px}

.section{margin:0 0 18px}
.section-head{display:flex;align-items:center;gap:12px;margin:2px 2px 10px;padding:1px 0}
.section-icon{width:56px;height:56px;min-width:56px;flex:0 0 56px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#16b6bd,#327cc6);color:#fff;box-shadow:0 8px 18px #168a9a26;overflow:hidden}
.section-icon svg,.section-icon img{display:block;width:30px!important;height:30px!important;max-width:30px;max-height:30px;object-fit:contain;justify-self:center;align-self:center;flex:none}

.bundle{
  --period-accent:#24c1c6;
  flex:0 0 168px;width:168px;height:183px;border-radius:18px;border:1px solid var(--line);
  background:#fbfffd;box-shadow:0 6px 14px var(--shadow);overflow:hidden;display:flex;flex-direction:column;
}
.bundle.period-daily{--period-accent:#20c6c7}
.bundle.period-weekly{--period-accent:#4f8ef7}
.bundle.period-monthly{--period-accent:#88c93a}
.cover{
  height:58px;position:relative;flex:none;padding:9px 10px;color:#fff;overflow:hidden;
  background:radial-gradient(circle at 80% -18%,#ffffff82,transparent 50%),linear-gradient(125deg,#18b6c2,#6de5e1 52%,#387bc5);
}
.cover-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.cover-name{font-size:12px;font-weight:900;line-height:1.12;max-width:112px;letter-spacing:-.15px;overflow-wrap:normal}.cover-title{display:flex;flex-direction:column;gap:3px;min-width:0}.cover-hint{font-size:9px;line-height:1.1;color:#e8fcff;opacity:.86;font-weight:650;max-width:106px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{font-size:9px;font-weight:900;display:inline-block;border-radius:12px;background:#ffffff3d;padding:4px 7px;white-space:nowrap;backdrop-filter:blur(2px)}
/* Large category illustration embedded in the header as a low-contrast watermark. */
.cover{isolation:isolate}

.cover-art-gift img{display:block;width:100%;height:100%;object-fit:contain;filter:brightness(0) invert(1)}
.cover::before{content:"";position:absolute;z-index:-1;right:-18px;top:-26px;width:130px;height:86px;background:radial-gradient(ellipse,#ffffff20,transparent 72%);pointer-events:none}
.cover-top{position:relative;z-index:1}
.cover-icon{display:none}
.card-body{padding:7px 10px 9px;display:flex;flex-direction:column;flex:1;min-height:0}
.validity{display:inline-flex;align-items:center;align-self:flex-start;gap:5px;font-size:9px;font-weight:750;color:#477780;background:#ecf6f3;border-radius:10px;padding:4px 7px;margin:6px 0 0;line-height:1.1;border:1px solid #deece8}.period-pill{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:18px;padding:0 7px;border-radius:999px;font-size:8px;font-weight:900;letter-spacing:.2px;color:#fff}.period-daily .period-pill{background:#20c6c7}.period-weekly .period-pill{background:#4f8ef7}.period-monthly .period-pill{background:#88c93a}.period-daily .validity{background:#ebfcfb;color:#167b84;border-color:#c7efee}.period-weekly .validity{background:#eef4ff;color:#325ea9;border-color:#d7e5ff}.period-monthly .validity{background:#f3faea;color:#557d1d;border-color:#dcecc4}
.detail-text{margin-top:5px;font-size:11px;line-height:1.3;font-weight:900;color:#184a57;letter-spacing:-.08px;min-height:27px;display:flex;align-items:center}
.duration-chip{display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;min-width:76px;height:24px;padding:0 10px;margin-top:8px;border-radius:999px;font-size:10px;font-weight:900;letter-spacing:.2px;border:1px solid transparent}
.period-daily .duration-chip{background:#e6fbf8;color:#118490;border-color:#bdeee7}
.period-weekly .duration-chip{background:#eef3ff;color:#315fb7;border-color:#d8e2ff}
.period-monthly .duration-chip{background:#f2f8e8;color:#5d861b;border-color:#d9e9bf}
.purchase-row{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding-top:8px}
.price{color:#7d98a1;font-size:9px;line-height:1.1;font-weight:700;margin:0;white-space:nowrap}
.price b{color:#2f6673;font-size:12px;font-weight:800}
.activate{min-height:29px;border:0;border-radius:16px;background:var(--accent);color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.empty{border:1px dashed #8cbdb4;background:#eaf8eef1;padding:24px 12px;text-align:center;border-radius:17px;color:#3e6d73}
.note{font-size:10px;color:#275b60;padding:2px 4px}
.bottom{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:9px;right:9px;height:78px;border-radius:42px;border:1.5px solid white;background:linear-gradient(105deg,#c6dff4f1,#e7f9e8f2);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:6px 5px;box-shadow:0 8px 24px #125a5a40;z-index:3;overflow:visible}
.nav{border:0;background:none;color:#193a48;height:59px;border-radius:31px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:3px;flex-direction:column;min-width:0}
.nav span{font-size:21px;font-weight:400}.nav.active{background:#1fb3bc}.brand-button{height:75px;width:75px;border-radius:50%;background:linear-gradient(155deg,#c6e72e,#35be99 60%,#15aac3);color:#fff;font-size:17px;font-weight:900;position:relative;top:-10px;border:2px solid #effbef;box-shadow:0 5px 12px #174d5c55;justify-self:center;z-index:2}
.modal-overlay{position:absolute;inset:0;background:#0d30335e;z-index:6;display:none;align-items:end}.modal-overlay.show{display:flex}
.sheet{background:#f5fff8;border-radius:25px 25px 0 0;width:100%;padding:20px 20px 28px;box-shadow:0 -10px 40px #0f4b5840}.sheet-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#dcefeb;border-radius:50%;width:29px;height:29px;font-size:19px}.sheet h2{font-size:21px;margin:9px 0}.sheet p{font-size:12px;color:#4f7177;line-height:1.5}.sheet-list{padding-left:18px;font-size:12px;line-height:1.9}.sheet-price{font-size:19px;font-weight:900;color:#0a9cad;margin:12px 0}.confirm{height:43px;width:100%;border:0;background:#13aeb9;color:#fff;border-radius:23px;font-weight:900}
.toast{position:absolute;bottom:103px;left:50%;transform:translateX(-50%);background:#073a46;color:white;padding:9px 14px;border-radius:20px;white-space:nowrap;z-index:9;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(max-width:420px){body{overflow:hidden}.phone{width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;border-radius:0;box-shadow:none}.scroll{padding-left:16px;padding-right:16px}.bottom{left:10px;right:10px}}
@media(min-width:700px){.phone{margin:26px auto}}

/* V20: coherent activation and renewal states */
.tag-active{background:#e9fff0;color:#116a49;border:1px solid #d2f6e1;box-shadow:0 1px 5px #104a3830}
.activate.unavailable,.confirm.unavailable{background:#cbd7db;color:#6b7f85;border:1px solid #b5c6ca;box-shadow:none;cursor:pointer}
.sheet{max-height:min(82%,690px);overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;padding-bottom:calc(25px + env(safe-area-inset-bottom,0px))}

.sheet-active{font-size:12px;font-weight:800;color:#146a49;background:#e5f8ea;border-radius:10px;padding:9px 11px;margin:3px 0 10px}.sheet-expiry{margin:2px 0 10px;font-size:12px;color:#3d6b73;font-weight:700}.sheet-expiry[hidden]{display:none!important}.sheet-expiry strong{color:#184a57}

.sheet-list{margin:8px 0 12px;padding-left:20px}.sheet-list li{margin:3px 0}
.subtools{display:flex;justify-content:flex-end;align-items:center;margin:-4px 0 10px}.secondary-btn{height:34px;border-radius:18px;border:1px solid #d5ece5;background:#eff9f5;color:#155663;font-size:11px;font-weight:850;padding:0 13px;display:inline-flex;align-items:center;gap:6px}.secondary-btn span{font-size:13px;line-height:1}.history-sheet{max-height:min(80%,690px)}.history-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}.history-item{border:1px solid #d8ebe6;border-radius:16px;background:#fbfffd;padding:12px 12px 11px}.history-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.history-title{font-size:14px;font-weight:900;line-height:1.15;color:#163f57}.history-meta{font-size:10px;color:#5b7f89;font-weight:700;margin-top:3px}.history-info{font-size:10px;color:#41636c;margin-top:8px;line-height:1.4}.history-actions{display:flex;align-items:center;gap:8px;margin-top:10px}.history-price{font-size:12px;font-weight:900;color:#0a9cad;margin-right:auto}.history-empty{padding:14px;border:1px dashed #cfe3de;border-radius:16px;background:#f7fdfb;color:#557b83;font-size:12px;text-align:center}
@media(max-width:360px){.scroll{padding-left:12px;padding-right:12px}.tools{gap:5px}.tool{width:38px;height:38px}.logo{font-size:30px}.bundle{flex-basis:156px;width:156px}.cover-name{font-size:11px}.hero h1{font-size:21px}.section-title{font-size:17px}}

@media(max-width:360px){.hero{padding-left:13px;padding-right:12px}.hero h1{font-size:18px}.hero p{font-size:10px}.hero-history{padding:0 8px;font-size:10px;min-height:32px}}
.gift-symbol{stroke:#fff;stroke-width:3;fill:none}.gift-symbol .gift-bow{stroke:#d3fff4;stroke-width:3.4}

.share-fallback{border-radius:13px;border:1px solid #cde6df;background:#ffffff;padding:12px;margin-top:10px}.share-fallback[hidden]{display:none}.share-fallback p{margin:0 0 8px;font-size:11px;color:#52717b}.share-fallback textarea{width:100%;resize:vertical;min-height:92px;border-radius:9px;border:1px solid #c8e0de;font:12px/1.5 system-ui,sans-serif;color:#13424d;padding:8px}.share-fallback button{margin-top:8px;border:0;background:#d9f4ed;color:#116d7a;border-radius:15px;padding:8px 12px;font-weight:800}

<body>
<main class="phone">
  <div class="scroll">
    <header class="top">
      <div class="logo">zain</div>
      <div class="tools">
        <button class="tool bell" aria-label="Notifications" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 16.5h9l-1.2-1.9v-3.2a3.3 3.3 0 0 0-6.6 0v3.2z"></path><path d="M10 18.2a2.3 2.3 0 0 0 4 0"></path></svg>
        </button>
        <button class="tool theme" aria-label="Theme" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.8v2.1M12 19.1v2.1M21.2 12h-2.1M4.9 12H2.8M18.6 5.4l-1.5 1.5M6.9 17.1l-1.5 1.5M18.6 18.6l-1.5-1.5M6.9 6.9 5.4 5.4"></path></svg>
        </button>
      </div>
    </header>

    <div class="hero">

function parseDays(valid){const m=String(valid).match(/(\d+)/);return m?parseInt(m[1],10):0}
function dateAfter(days){const d=new Date(Date.UTC(2026,9,26,12,0,0));d.setUTCDate(d.getUTCDate()+days);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'})}
function stampNow(){return new Date(Date.UTC(2026,9,26,12,0,0)).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'UTC'})}

function render(){
  sections.innerHTML='';
  const cats=['Offers','Data','Combo','Roaming'];
  let visibleCount=0;

  for(const cat of cats){
    const items=catalog.filter(item=>item.cat===cat && (filter==='All' || item.period===filter));
    if(!items.length) continue;
    visibleCount += items.length;

    const section=document.createElement('section');
    section.className='section';
    section.innerHTML=`<div class="section-head"><div class="section-icon" aria-hidden="true">${meta[cat].icon}</div><div class="section-copy"><div class="section-title">${meta[cat].title}</div><div class="section-desc">${meta[cat].desc}</div></div></div><div class="rail"></div>`;

    const rail=section.querySelector('.rail');
    const periodOrder={Daily:0,Weekly:1,Monthly:2};
    items.sort((a,b)=>{
      const pa=(periodOrder[a.period] ?? 99);
      const pb=(periodOrder[b.period] ?? 99);
      if(pa!==pb) return pa-pb;
      return (a.price||0)-(b.price||0);
    });
    for(const item of items){
      const card=document.createElement('article');
      card.className='bundle period-'+item.period.toLowerCase()+' '+item.cat.toLowerCase().replace('offers','offer');
      card.innerHTML=`
        <div class="cover">
          ${headerArt(item.cat)}
          <div class="cover-top">
            <div class="cover-title"><div class="cover-name">${item.name}</div>${item.hint?`<div class="cover-hint">${item.hint}</div>`:''}</div>
            ${stateFor(item.id).active?`<span class="tag tag-active">✓ Active</span>`:(item.tag?`<span class="tag">${item.tag}</span>`:'')}
          </div>
          <span class="cover-icon">${item.icon}</span>
        </div>
        <div class="card-body">
          ${detailMarkup(item)}
          <div class="duration-chip">${item.period}</div>
          <div class="purchase-row"><div class="price">Price <b>${fmt(item.price)}</b></div><button class="activate ${stateFor(item.id).active&&!stateFor(item.id).canRepeat?'unavailable':''}" aria-disabled="false" data-id="${item.id}">${buttonCopy(item)} <span aria-hidden="true">›</span></button></div>
        </div>`;
      rail.append(card);
    }
    sections.append(section);
  }

  if(!visibleCount){
    sections.innerHTML='<div class="empty">No bundles available for this duration.</div>';
  }
}

function toast(text){
  const el=document.getElementById('toast');
  el.textContent=text;
  el.classList.add('show');
  clearTimeout(timer);
  timer=setTimeout(()=>el.classList.remove('show'),2400);
}

function openBundle(itemId){
  selected=catalog.find(x=>x.id===itemId);
  if(!selected) return;
  document.getElementById('sheet-category').textContent=selected.cat+' · '+selected.period;
  document.getElementById('sheet-title').textContent=selected.name;
  document.getElementById('sheet-description').textContent=`▦ ${selected.valid}`;
  document.getElementById('sheet-list').innerHTML=selected.details.filter(t=>!/^valid for /i.test(t)).map(t=>`<li>${t}</li>`).join('');
  const state=stateFor(selected.id);
  document.getElementById('sheet-active').hidden=!state.active;
  document.getElementById('sheet-expiry').hidden=!state.active;
  document.getElementById('sheet-expiry').innerHTML=state.active ? `<strong>Valid until</strong> ${state.activeUntil||dateAfter(parseDays(selected.valid))}` : '';
  document.getElementById('renewal-row').hidden=!state.active;
  document.getElementById('renewal-desc').textContent=state.renewalOn ? 'Enabled · renews at expiry' : 'Off · auto renewal available';
  document.getElementById('renewal-stop').hidden=!state.renewalOn;
  const confirm=document.getElementById('confirm');
  confirm.textContent=buttonCopy(selected);
  confirm.classList.toggle('unavailable',state.active&&!state.canRepeat);
  confirm.setAttribute('aria-disabled','false');
  document.getElementById('sheet-price').textContent=fmt(selected.price);
  document.getElementById('overlay').classList.add('show');
}

function renderHistory(){
  const holder=document.getElementById('history-list');
  if(!activationHistory.length){holder.innerHTML='<div class="history-empty">No bundle activations yet.</div>';return;}
  holder.innerHTML=activationHistory.slice().reverse().map(entry=>{
    const item=catalog.find(x=>x.id===entry.id); if(!item) return '';
    const state=stateFor(item.id);
    return `<div class="history-item"><div class="history-top"><div><div class="history-title">${item.name}</div><div class="history-meta">${item.cat} · ${item.period}</div></div>${state.active?'<span class="tag tag-active">✓ Active</span>':''}</div><div class="history-info">Activated on ${entry.date}<br>${summaryText(item)}</div><div class="history-actions"><div class="history-price">${fmt(item.price)}</div><button class="activate ${state.active&&!state.canRepeat?'unavailable':''}" aria-disabled="false" data-history-id="${item.id}">${buttonCopy(item)} <span aria-hidden="true">›</span></button></div></div>`;
  }).join('');
}

sections.addEventListener('click',e=>{
  const btn=e.target.closest('[data-id]');
  if(!btn) return;
  openBundle(btn.dataset.id);
});

document.getElementById('filters').addEventListener('click',e=>{
  const chip=e.target.closest('.chip');
  if(!chip) return;
  filter=chip.dataset.filter;
  document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active', x===chip));
  render();
});

document.getElementById('history-btn').onclick=()=>{renderHistory();document.getElementById('history-overlay').classList.add('show')};
document.getElementById('history-close').onclick=()=>document.getElementById('history-overlay').classList.remove('show');
document.getElementById('history-overlay').addEventListener('click',e=>{if(e.target.id==='history-overlay')e.currentTarget.classList.remove('show')});
document.getElementById('history-list').addEventListener('click',e=>{
  const btn=e.target.closest('[data-history-id]');
  if(!btn) return;
  const item=catalog.find(x=>x.id===btn.dataset.historyId); if(!item) return;
  const state=stateFor(item.id);
  if(state.active&&!state.canRepeat){toast('This bundle can only be activated once.');return;}
  const again=state.active;
  state.active=true;
  state.activeUntil=dateAfter(parseDays(item.valid));
  activationHistory.push({id:item.id,date:stampNow()});
  renderHistory();
  render();
  toast(again?'Bundle activated again':'Bundle activated');
});

document.getElementById('close').onclick=()=>document.getElementById('overlay').classList.remove('show');
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')e.currentTarget.classList.remove('show')});
document.getElementById('renewal-stop').onclick=()=>{
  if(!selected)return;
  const state=stateFor(selected.id);
  state.renewalOn=false;
  document.getElementById('renewal-desc').textContent='Off · no automatic renewal';
  document.getElementById('renewal-stop').hidden=true;
  render();
  renderHistory();
  toast('Auto renewal turned off');
};
document.getElementById('share-bundle').onclick=()=>{
  toast('Bundle shared successfully');
};
document.getElementById('confirm').onclick=()=>{
  if(!selected)return;
  const state=stateFor(selected.id);
  if(state.active&&!state.canRepeat){toast('This bundle can only be activated once.');return;}
  const again=state.active;
  state.active=true;
  state.activeUntil=dateAfter(parseDays(selected.valid));
  activationHistory.push({id:selected.id,date:stampNow()});
  document.getElementById('overlay').classList.remove('show');
  render();
  renderHistory();
  toast(again?'Bundle activated again':'Bundle activated');
};
document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>{if(el.dataset.nav!=='Bundles') toast('Demo: '+el.dataset.nav)});

render();
</script>
